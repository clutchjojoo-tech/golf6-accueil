name: Fabriquer l'application

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - id: s1
        uses: actions/checkout@v4
        continue-on-error: true

      - id: s2
        uses: actions/setup-java@v5
        continue-on-error: true
        with:
          distribution: temurin
          java-version: '17'

      - id: s3
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - id: s4
        uses: gradle/actions/setup-gradle@v4
        continue-on-error: true
        with:
          gradle-version: '8.7'

      - id: s5
        name: Fabriquer l'APK
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Bilan
        if: always()
        shell: bash
        run: |
          set +e
          echo "::error title=Bilan des etapes::checkout=${{ steps.s1.outcome }} java=${{ steps.s2.outcome }} android=${{ steps.s3.outcome }} gradle=${{ steps.s4.outcome }} build=${{ steps.s5.outcome }}"
          if [ -f build.log ]; then
            MSG=$(tail -n 30 build.log | cut -c1-250 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Fin du journal Gradle::${MSG}"
          fi
          [ "${{ steps.s5.outcome }}" = "success" ] || exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-et-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build.log
          if-no-files-found: ignore

name: Fabriquer l'application

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Fabriquer l'APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Afficher l'erreur
        if: failure()
        shell: bash
        run: |
          MSG=$(grep -E -m 6 -A 4 'What went wrong|error:|Could not|Execution failed|FAILURE' build.log | head -40 | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Erreur de fabrication::${MSG:-Aucun journal: voir etape en echec}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-et-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build.log
          if-no-files-found: ignore
